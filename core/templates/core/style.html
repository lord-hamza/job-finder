<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #5d6675; --line: #dfe3e9;
  --accent: #1d4ed8; --accent-text: #ffffff; --field: #ffffff;
  --ok: #05603a; --ok-bg: #e6f6ed; --warn: #93370d; --warn-bg: #fef4e6;
  --bad: #a4170f; --bad-bg: #fdeceb; --info: #1849a9; --info-bg: #e8f1fd;
  --idle: #475467; --idle-bg: #eef0f4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101318; --card: #191d24; --text: #eceff4; --muted: #a0a9b8; --line: #2e3540;
    --accent: #5b8def; --accent-text: #0b1220; --field: #12161c;
    --ok: #6ee7a8; --ok-bg: #12301f; --warn: #fbbf72; --warn-bg: #352412;
    --bad: #fca5a0; --bad-bg: #3a1614; --info: #9dc2fb; --info-bg: #15294a;
    --idle: #b6bec9; --idle-bg: #262c35;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body.embedded { background: transparent; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 4px; }
h3 { font-size: 14px; margin: 0 0 8px; }
a { color: var(--accent); }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip.yes, .status-sent { background: var(--ok-bg); color: var(--ok); }
.chip.no, .status-failed { background: var(--bad-bg); color: var(--bad); }
.status-manual, .status-ready, .status-needs_you { background: var(--warn-bg); color: var(--warn); }
.status-queued, .status-processing, .status-sending, .status-running, .status-form_queue, .status-filling { background: var(--info-bg); color: var(--info); }
.status-skipped, .status-done { background: var(--idle-bg); color: var(--idle); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.grid { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-bottom: 16px; align-items: start; }
.setup { margin-bottom: 16px; }
.setup > summary { cursor: pointer; font-weight: 600; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 16px; }
.subsection { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
details.cv { padding: 8px 0 12px; border-bottom: 1px solid var(--line); }
details.cv > summary { cursor: pointer; overflow-wrap: anywhere; }
details.cv .cv-name { font-weight: 600; margin-right: 6px; }
details.cv .nowrap { white-space: nowrap; }
details.cv textarea { min-height: 160px; }
.save-bar { position: sticky; bottom: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: flex-end; margin: 16px -18px -18px; padding: 12px 18px; background: var(--card); border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
details.cv textarea[name=links] { min-height: 70px; }
details.cv .warn-text { display: block; color: var(--warn); }
details.cv .warn-inline { color: var(--warn); }
ul.accounts { list-style: none; margin: 0 0 8px; padding: 0; }
ul.accounts li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
ul.accounts button { padding: 4px 10px; font-size: 13px; }
select { width: 100%; padding: 8px 10px; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
label { display: block; font-size: 13px; font-weight: 500; margin: 10px 0 4px; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=file], input[type=search], textarea {
  width: 100%; padding: 8px 10px; font: inherit; color: var(--text); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; min-height: 220px; }
.checkbox { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 12px 0 0; }
.checkbox input { margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button {
  font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
}
button.secondary { background: transparent; color: var(--accent); }
.notice { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
.notice.success { background: var(--ok-bg); color: var(--ok); }
.notice.error { background: var(--bad-bg); color: var(--bad); }
.notice.info { background: var(--info-bg); color: var(--info); }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
iframe.activity { width: 100%; height: 620px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: block; }
.embedded-wrap { padding: 16px; }
.activity-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.activity-head h2 { margin: 0; }
.search { display: flex; gap: 8px; flex: 1 1 280px; max-width: 460px; }
.search input { flex: 1; min-width: 0; }
.hidden-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; font-size: 14px; }
.tab { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); text-decoration: none; white-space: nowrap; }
.tab:hover { border-color: var(--accent); }
.tab.current { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.tab strong { font-size: 16px; }
.chip-group { display: inline-flex; gap: 4px; }
.chip.add { background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 700; padding: 2px 9px; }
details.add-account { margin-top: 8px; }
details.add-account > summary { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; color: var(--accent); padding: 6px 12px 6px 6px; border: 1px solid var(--accent); border-radius: 8px; list-style: none; }
details.add-account > summary::-webkit-details-marker { display: none; }
details.add-account .plus { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-size: 16px; line-height: 1; }
details.add-account[open] > summary { margin-bottom: 4px; }
.run { font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
td.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.narrow { max-width: 760px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 16px; font-size: 14px; }
.description h2 { margin-bottom: 8px; }
.description h3 { font-size: 15px; margin: 18px 0 6px; }
.description p { margin: 0 0 10px; line-height: 1.6; }
.description ul { margin: 0 0 10px; padding-left: 22px; line-height: 1.6; }
.description li { margin: 2px 0; }
.description .original { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
.description .original summary { cursor: pointer; color: var(--muted); }
.description .original .sent-body { margin-top: 8px; max-height: 420px; overflow: auto; }
table.links td a strong, td a strong { font-weight: 600; }
.tab .running { color: var(--info); }
.sent-body { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--field); }
@media (max-width: 820px) {
  .grid, .setup-grid { grid-template-columns: 1fr; }
  .hide-small { display: none; }
}
</style>
