<fieldset class="cv-choice">
  <legend>Apply with</legend>
  {% for profile in profiles %}
  <label class="checkbox">
    <input type="checkbox" name="cv" value="{{ profile.market }}" {% if profile.selected %}checked{% endif %}>
    <span>{{ profile.get_market_display }}: {{ profile.rule_summary }}</span>
  </label>
  {% endfor %}
  <p class="small muted">With both ticked, it uses whichever CV suits the job best.</p>
</fieldset>
